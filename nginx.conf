# Web niaipartners.com: archivos estáticos + cabeceras de seguridad.
# Requisito: todo el JavaScript va en archivos .js propios (sin <script> en línea),
# salvo el bloque application/ld+json, que el navegador no ejecuta.
# Todo el CSS y las fuentes van en archivos propios (css/, fonts/): sin estilos en línea.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://eu-assets.i.posthog.com; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://eu.i.posthog.com https://eu-assets.i.posthog.com https://n8n.n8nniaipartners.tech; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
